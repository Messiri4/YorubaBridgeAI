[project]
name = "yorubabridge-ai"
version = "0.1.0"
description = "English <-> Yoruba text and voice translation service (WhatsApp-ready)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers -m 'not smoke'"
markers = [
    "smoke: tests that download/run the real NLLB model (run via: pytest -m smoke)",
]
filterwarnings = ["ignore::DeprecationWarning"]
