<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>YorubaBridge AI — Translator</title>
    <style>
      :root {
        color-scheme: light;
      }
      * {
        box-sizing: border-box;
      }
      body {
        font-family: -apple-system, "Segoe UI", sans-serif;
        margin: 0;
        background: #f4f6f8;
        color: #18202b;
      }
      header {
        background: #14532d;
        color: #fff;
        padding: 18px 24px;
      }
      header h1 {
        margin: 0;
        font-size: 1.25rem;
      }
      header p {
        margin: 4px 0 0;
        opacity: 0.85;
        font-size: 0.9rem;
      }
      main {
        max-width: 760px;
        margin: 24px auto;
        padding: 0 16px;
      }
      .card {
        background: #fff;
        border-radius: 12px;
        padding: 20px;
        box-shadow: 0 1px 4px rgba(0, 0, 0, 0.08);
        margin-bottom: 18px;
      }
      .row {
        display: flex;
        gap: 10px;
        align-items: center;
        margin-bottom: 12px;
        flex-wrap: wrap;
      }
      select,
      textarea,
      button {
        font-size: 1rem;
      }
      select {
        padding: 8px 10px;
        border-radius: 8px;
        border: 1px solid #cbd5e0;
      }
      textarea {
        width: 100%;
        min-height: 96px;
        padding: 12px;
        border-radius: 8px;
        border: 1px solid #cbd5e0;
        resize: vertical;
      }
      button {
        background: #14532d;
        color: #fff;
        border: 0;
        border-radius: 8px;
        padding: 10px 20px;
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.5;
        cursor: wait;
      }
      .swap {
        background: #e2e8f0;
        color: #18202b;
        padding: 8px 12px;
      }
      .out {
        background: #f0fdf4;
        border: 1px solid #bbf7d0;
        border-radius: 8px;
        padding: 12px;
        min-height: 48px;
        white-space: pre-wrap;
      }
      .meta {
        color: #64748b;
        font-size: 0.85rem;
        margin-top: 8px;
      }
      .err {
        background: #fef2f2;
        border: 1px solid #fecaca;
        color: #991b1b;
        border-radius: 8px;
        padding: 12px;
      }
      .examples {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }
      .examples button {
        background: #eef2f6;
        color: #18202b;
        padding: 6px 12px;
        font-size: 0.85rem;
      }
      footer {
        text-align: center;
        color: #94a3b8;
        font-size: 0.8rem;
        padding: 16px;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>🌉 YorubaBridge AI</h1>
      <p>English ↔ Yorùbá translation · NLLB-200 · running locally</p>
    </header>
    <main>
      <div class="card">
        <div class="row">
          <select id="src">
            <option value="eng">English</option>
            <option value="yor">Yorùbá</option>
          </select>
          <button class="swap" id="swap" title="Swap languages">⇄</button>
          <select id="tgt">
            <option value="yor">Yorùbá</option>
            <option value="eng">English</option>
          </select>
        </div>
        <textarea id="text" placeholder="Type text to translate…"></textarea>
        <div class="row" style="margin-top: 10px">
          <button id="go">Translate</button>
          <span class="meta">Try:</span>
          <span class="examples">
            <button data-t="Good morning, how are you?">Good morning…</button>
            <button data-t="Where is the market?">Where is the market?</button>
            <button data-t="Thank you very much for your help.">
              Thank you…
            </button>
            <button data-t="Ẹ kú ìrọ̀lẹ́, ọrẹ́ mi.">Ẹ kú ìrọ̀lẹ́…</button>
          </span>
        </div>
      </div>
      <div class="card" id="resultCard" hidden>
        <div class="out" id="out"></div>
        <div class="meta" id="meta"></div>
      </div>
      <div class="card" id="errorCard" hidden>
        <div class="err" id="err"></div>
      </div>
    </main>
    <footer>YorubaBridge AI · local demo · NLLB-200-distilled-600M</footer>
    <script>
      const $ = (id) => document.getElementById(id);
      $("swap").onclick = () => {
        const s = $("src").value;
        $("src").value = $("tgt").value;
        $("tgt").value = s;
      };
      document.querySelectorAll(".examples button").forEach(
        (b) =>
          (b.onclick = () => {
            $("text").value = b.dataset.t;
          }),
      );
      $("go").onclick = async () => {
        const text = $("text").value.trim();
        $("resultCard").hidden = true;
        $("errorCard").hidden = true;
        if (!text) {
          $("err").textContent = "Please enter some text.";
          $("errorCard").hidden = false;
          return;
        }
        $("go").disabled = true;
        $("go").textContent = "Translating…";
        const t0 = performance.now();
        try {
          const resp = await fetch("/api/v1/translate", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              text,
              source_language: $("src").value,
              target_language: $("tgt").value,
            }),
          });
          if (!resp.ok) {
            const body = await resp.json().catch(() => ({}));
            throw new Error(body.detail || resp.statusText);
          }
          const data = await resp.json();
          $("out").textContent = data.translated_text;
          $("meta").textContent =
            `latency ${data.latency_ms} ms · cached ${data.cached ? "yes" : "no"} · server total ${Math.round(performance.now() - t0)} ms`;
          $("resultCard").hidden = false;
        } catch (e) {
          $("err").textContent = "Translation failed: " + e.message;
          $("errorCard").hidden = false;
        } finally {
          $("go").disabled = false;
          $("go").textContent = "Translate";
        }
      };
      $("text").addEventListener("keydown", (e) => {
        if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) $("go").click();
      });
    </script>
  </body>
</html>
